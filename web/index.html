<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icono.svg">
<title>Mi casa</title>
<style>
  :root {
    --fondo: #0b0d12;
    --texto: #f4f6fa;
    --suave: rgba(244, 246, 250, .55);
    --vidrio: rgba(255, 255, 255, .07);
    --borde: rgba(255, 255, 255, .10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fondo); color: var(--texto);
               font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; text-align: inherit; }
  .oculta { display: none !important; }

  /* Fondo que toma el color de lo que se está viendo */
  #ambiente { position: fixed; inset: 0; transition: background 1s ease;
              background: radial-gradient(120% 70% at 50% 28%, var(--ambiente, #1a1f2b) 0%, transparent 65%); opacity: .55; }

  /* ---- Inicio: reloj + mosaicos ---- */
  #inicio { position: fixed; inset: 0; overflow-y: auto; scrollbar-width: none;
            padding: calc(28px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom)); }
  #inicio::-webkit-scrollbar { display: none; }
  #inicio > * { max-width: 520px; margin-left: auto; margin-right: auto; }
  .reloj { text-align: center; margin-bottom: 26px; }
  .reloj .hora { font-size: 72px; font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .reloj .fecha { margin-top: 6px; color: var(--suave); font-size: 16px; }
  h2 { margin: 0 4px 10px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); }
  .bloque { margin-bottom: 24px; }

  .escenas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .escena { border: 1px solid var(--borde); background: var(--vidrio); border-radius: 20px; padding: 12px 2px 10px;
            display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12.5px; color: var(--suave); transition: all .2s; }
  .escena span { font-size: 28px; line-height: 1; }
  .escenas.sin-luces .escena { opacity: .35; pointer-events: none; }
  /* Selector de luces para las escenas */
  .selector { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip { border: 1px solid var(--borde); background: var(--vidrio); border-radius: 99px; padding: 7px 14px 7px 10px; font-size: 14px;
          color: var(--suave); display: flex; align-items: center; gap: 7px; transition: all .2s; }
  .chip i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--suave); display: grid; place-items: center; font-style: normal; font-size: 11px; }
  .chip.sel { background: rgba(255, 255, 255, .9); color: #101218; border-color: transparent; }
  .chip.sel i { background: #101218; border-color: #101218; color: #fff; }
  .escena:active, .escena.tocada { background: rgba(255, 255, 255, .2); color: var(--texto); transform: scale(.96); }

  .grilla { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mosaico { position: relative; border: 1px solid var(--borde); background: var(--vidrio); border-radius: 24px;
             min-height: 132px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between;
             transition: background .4s, border-color .4s, box-shadow .4s; overflow: hidden; }
  .mosaico:active { transform: scale(.98); }
  .mosaico .m-icono { font-size: 30px; line-height: 1; }
  .mosaico .m-titulo { font-size: 17px; font-weight: 650; margin-top: 10px; }
  .mosaico .m-sub { color: var(--suave); font-size: 14px; }
  .mosaico .m-grande { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .mosaico.ancho { grid-column: span 2; min-height: 0; flex-direction: row; align-items: center; justify-content: flex-start; gap: 14px; }

  /* Mosaico de luz: se tiñe con el color de la luz cuando está prendida */
  .m-luz .abrir { all: unset; position: absolute; inset: 0; cursor: pointer; }
  .m-luz .m-icono { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .08);
                    transition: all .4s; position: relative; pointer-events: none; }
  .m-luz .m-icono svg { width: 22px; height: 22px; stroke: var(--suave); fill: none; stroke-width: 2.2; stroke-linecap: round; }
  .m-luz .textos { pointer-events: none; position: relative; }
  .m-luz .m-power { position: absolute; top: 12px; right: 12px; width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--borde);
                    background: rgba(255, 255, 255, .06); display: grid; place-items: center; }
  .m-luz .m-power svg { width: 22px; height: 22px; stroke: var(--suave); fill: none; stroke-width: 2.4; stroke-linecap: round; }
  .m-luz.on { background: color-mix(in srgb, var(--color) 20%, rgba(255, 255, 255, .05)); border-color: color-mix(in srgb, var(--color) 45%, transparent);
              box-shadow: 0 0 40px -8px color-mix(in srgb, var(--color) 55%, transparent); }
  .m-luz.on .m-icono { background: var(--color); box-shadow: 0 0 22px color-mix(in srgb, var(--color) 80%, transparent); }
  .m-luz.on .m-icono svg { stroke: #101218; }
  .m-luz.on .m-power { background: rgba(255, 255, 255, .9); border-color: transparent; }
  .m-luz.on .m-power svg { stroke: #101218; }
  .m-luz.offline { opacity: .45; }

  .m-clima { justify-content: center; gap: 10px; }
  .m-clima .fila { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .m-clima .fila b { font-size: 24px; font-variant-numeric: tabular-nums; }
  .m-clima .fila span:last-child { color: var(--suave); }

  /* ---- Detalle: una pantalla por luz o ventana de información ---- */
  #detalle { position: fixed; inset: 0; }
  #volver { position: absolute; z-index: 2; top: calc(14px + env(safe-area-inset-top)); left: 12px; border: 1px solid var(--borde);
            background: rgba(20, 23, 31, .7); border-radius: 99px; padding: 8px 16px 8px 12px; font-size: 15px; display: flex; align-items: center; gap: 4px; }
  #volver svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  .luz { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: space-between;
         padding: calc(76px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom)); overflow-y: auto; }
  .luz.activa { display: flex; }
  .luz > * { width: 100%; max-width: 420px; }

  .cabecera { text-align: center; }
  .nombre { margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -.02em; }
  .estado { margin-top: 4px; color: var(--suave); font-size: 15px; }

  /* Botón de encendido */
  .centro { display: flex; justify-content: center; padding: 12px 0; }
  .power { position: relative; width: 168px; height: 168px; border-radius: 50%; border: 1px solid var(--borde);
           background: var(--vidrio); display: grid; place-items: center; transition: all .35s ease; }
  .power svg { width: 64px; height: 64px; stroke: var(--suave); fill: none; stroke-width: 2.2;
               stroke-linecap: round; transition: stroke .35s; }
  .luz.on .power { background: var(--color); border-color: transparent;
                   box-shadow: 0 0 0 14px color-mix(in srgb, var(--color) 18%, transparent),
                               0 0 90px 10px color-mix(in srgb, var(--color) 55%, transparent); }
  .luz.on .power svg { stroke: #101218; }
  .power:active { transform: scale(.96); }

  /* Controles */
  .controles { display: flex; flex-direction: column; gap: 22px; }
  .fila-titulo { display: flex; justify-content: space-between; color: var(--suave); font-size: 14px; margin-bottom: 10px; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; margin: 0; outline: none; touch-action: pan-y; }
  input[type=range]::-webkit-slider-runnable-track { border-radius: 99px; }
  input[type=range]::-moz-range-track { border-radius: 99px; }

  /* Brillo: barra gruesa que se llena */
  .brillo { height: 58px; border-radius: 99px;
            background: linear-gradient(to right, var(--color) var(--p, 50%), var(--vidrio) var(--p, 50%)); border: 1px solid var(--borde); }
  .brillo::-webkit-slider-thumb { -webkit-appearance: none; width: 4px; height: 58px; background: transparent; }
  .brillo::-moz-range-thumb { width: 4px; height: 58px; background: transparent; border: 0; }

  /* Tono: arcoíris */
  .tono { height: 26px; border-radius: 99px; border: 1px solid var(--borde);
          background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  .tono::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%;
          background: #fff; border: 3px solid rgba(0, 0, 0, .35); box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
  .tono::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 3px solid rgba(0, 0, 0, .35); }

  .blancos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .blanco { border: 1px solid var(--borde); background: var(--vidrio); border-radius: 16px; padding: 13px 0; font-size: 15px; text-align: center; transition: background .2s; }
  .blanco:active { background: rgba(255, 255, 255, .18); }
  .blanco i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }

  .luz.offline .centro, .luz.offline .controles { opacity: .25; pointer-events: none; }

  /* Ventanas de información (viaje y clima) */
  .info { justify-content: center; gap: 28px; }
  .grande { font-size: 84px; font-weight: 700; letter-spacing: -.04em; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
  .sub { margin-top: 8px; text-align: center; color: var(--suave); font-size: 16px; }
  .datos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .dato { border: 1px solid var(--borde); background: var(--vidrio); border-radius: 16px; padding: 12px 6px; text-align: center; }
  .dato b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .dato span { color: var(--suave); font-size: 13px; }
  .aviso { text-align: center; color: var(--suave); font-size: 15px; }
  .info.clima { justify-content: space-evenly; gap: 16px; }
  .lugar { border: 1px solid var(--borde); background: var(--vidrio); border-radius: 24px; padding: 18px 20px; }
  .lugar .arriba { display: flex; justify-content: space-between; align-items: baseline; color: var(--suave); font-size: 15px; }
  .lugar .medio { display: flex; align-items: center; gap: 14px; margin: 6px 0 8px; }
  .lugar .icono { font-size: 52px; line-height: 1; }
  .lugar .temp { font-size: 56px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .lugar .desc { font-size: 17px; }
  .lugar .extra { color: var(--suave); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; }

  /* ---- Modo noche: pantalla negra con un reloj tenue ---- */
  #noche { position: fixed; inset: 0; z-index: 10; background: #000; display: flex; flex-direction: column;
           align-items: center; justify-content: center; color: rgba(255, 255, 255, .32); cursor: pointer; }
  #noche .hora { font-size: 112px; font-weight: 200; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  #noche .fecha { margin-top: 10px; font-size: 18px; }
  #noche .salida { margin-top: 36px; font-size: 16px; color: rgba(255, 255, 255, .22); }
  #noche .pista { position: absolute; bottom: calc(26px + env(safe-area-inset-bottom)); font-size: 13px; color: rgba(255, 255, 255, .14); }

  @media (max-height: 640px) { .power { width: 128px; height: 128px; } .power svg { width: 48px; height: 48px; } .controles { gap: 14px; }
                               .reloj .hora { font-size: 56px; } .mosaico { min-height: 112px; } }
</style>
</head>
<body>
<div id="ambiente"></div>

<main id="inicio">
  <header class="reloj"><div class="hora"></div><div class="fecha"></div></header>
  <section class="bloque"><h2>Escenas</h2><div class="selector" id="selector"></div><div class="escenas" id="escenas"></div></section>
  <section class="bloque"><h2>Luces</h2><div class="grilla" id="grilla-luces"></div></section>
  <section class="bloque"><h2>Hoy</h2>
    <div class="grilla">
      <button class="mosaico" id="m-viaje">
        <div class="m-icono">🚗</div>
        <div><div class="m-grande">--:--</div><div class="m-sub">Salir al trabajo</div></div>
      </button>
      <button class="mosaico m-clima" id="m-clima">
        <div class="m-icono">🌡️</div>
        <div class="filas"></div>
      </button>
      <button class="mosaico ancho" id="m-noche">
        <div class="m-icono">🌙</div>
        <div><div class="m-titulo" style="margin:0">Modo noche</div><div class="m-sub">Apaga la pantalla y deja un reloj tenue</div></div>
      </button>
    </div>
  </section>
</main>

<div id="detalle" class="oculta">
  <button id="volver"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Inicio</button>
</div>

<div id="noche" class="oculta">
  <div class="hora"></div><div class="fecha"></div><div class="salida"></div>
  <div class="pista">Tocá la pantalla para volver</div>
</div>

<script>
const inicio = document.getElementById('inicio');
const detalle = document.getElementById('detalle');
const ambiente = document.getElementById('ambiente');
const grillaLuces = document.getElementById('grilla-luces');
const tarjetas = {};      // id -> pantalla de la luz
const mosaicos = {};      // id -> mosaico de la luz en el inicio
const tocado = {};        // id -> instante del último toque (para no pisar lo que estás moviendo)
const pendiente = {};     // id -> cambios acumulados por enviar
const temporizador = {};

const ICONO = '<svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>';
const FOCO = '<svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>';
const PRESETS = [['Cálido', 0, '#ffb86b'], ['Neutro', 50, '#fff1dc'], ['Frío', 100, '#cfe3ff']];

// Escenas: se aplican a todas las luces a la vez
const ESCENAS = [
  ['Apagar', '🌑', { encendida: false }],
  ['Prender', '💡', { encendida: true, blanco: 50, brillo: 100 }],
  ['Relax', '🛋️', { encendida: true, blanco: 0, brillo: 45 }],
  ['Tenue', '🕯️', { encendida: true, blanco: 0, brillo: 8 }],
  ['Cine', '🎬', { encendida: true, color: '#5b3cff', brillo: 25 }],
];

// Modo noche automático: entre estas horas el panel pasa solo al reloj tenue
const NOCHE_DESDE = '23:00', NOCHE_HASTA = '06:30';

// ---- color ----
function hexAHue(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), d = max - Math.min(r, g, b);
  if (!d) return 0;
  const h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return Math.round(((h * 60) + 360) % 360);
}
function hueAHex(h) {
  const f = n => { const k = (n + h / 60) % 6; return Math.round(255 * (1 - Math.max(0, Math.min(k, 4 - k, 1)))); };
  return '#' + [f(5), f(3), f(1)].map(v => v.toString(16).padStart(2, '0')).join('');
}

// ---- envío (agrupa y limita la frecuencia mientras deslizás) ----
function enviar(id, cambios, ya) {
  tocado[id] = Date.now();
  pendiente[id] = Object.assign(pendiente[id] || {}, cambios);
  if (temporizador[id] && !ya) return;
  const mandar = async () => {
    const lote = pendiente[id]; pendiente[id] = null; temporizador[id] = null;
    if (!lote) return;
    try {
      const r = await fetch('/api/luces/' + id, { method: 'POST', body: JSON.stringify(lote) });
      if (r.ok && !tocadoReciente(id)) pintar(await r.json());
    } catch (e) {}
  };
  if (ya) { clearTimeout(temporizador[id]); return mandar(); }
  temporizador[id] = setTimeout(mandar, 140);
}
const tocadoReciente = id => Date.now() - (tocado[id] || 0) < 2500;

// ---- navegación: inicio <-> detalle ----
let abierta = null;
if (history.state) history.replaceState(null, '');   // al recargar se arranca siempre en el inicio
function abrir(s) {
  detalle.querySelectorAll('.luz.activa').forEach(x => x.classList.remove('activa'));
  s.classList.add('activa');
  abierta = s;
  detalle.classList.remove('oculta');
  inicio.classList.add('oculta');
  if (!history.state) history.pushState({ detalle: true }, '');
  pintarAmbiente();
}
function cerrar() {
  if (!abierta) return;
  abierta.classList.remove('activa');
  abierta = null;
  detalle.classList.add('oculta');
  inicio.classList.remove('oculta');
  pintarAmbiente();
}
document.getElementById('volver').onclick = () => history.state ? history.back() : cerrar();
addEventListener('popstate', cerrar);   // botón "atrás" de Android
addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('volver').click(); });

function pintarAmbiente() {
  const s = abierta;
  let c = '#1a1f2b';
  if (s && s.dataset.ambiente) c = s.dataset.ambiente;
  else if (s && s.classList.contains('on')) c = s.style.getPropertyValue('--color') || c;
  ambiente.style.setProperty('--ambiente', c);
}

// ---- pantalla de cada luz ----
function crear(l) {
  const s = document.createElement('section');
  s.className = 'luz';
  s.innerHTML = `
    <div class="cabecera"><h1 class="nombre"></h1><div class="estado"></div></div>
    <div class="centro"><button class="power" aria-label="Encender o apagar">${ICONO}</button></div>
    <div class="controles">
      <div><div class="fila-titulo"><span>Brillo</span><span class="pct"></span></div>
        <input class="brillo" type="range" min="1" max="100"></div>
      <div><div class="fila-titulo"><span>Color</span></div>
        <input class="tono" type="range" min="0" max="359"></div>
      <div class="blancos">${PRESETS.map(p => `<button class="blanco" data-t="${p[1]}"><i style="background:${p[2]}"></i>${p[0]}</button>`).join('')}</div>
    </div>`;
  s.querySelector('.nombre').textContent = l.nombre;

  const alternar = () => {
    const encender = !s.classList.contains('on');
    s.classList.toggle('on', encender);               // respuesta inmediata
    textoEstado(s);
    enviar(l.id, { encendida: encender }, true);
  };
  s.querySelector('.power').onclick = alternar;
  const brillo = s.querySelector('.brillo'), tono = s.querySelector('.tono');
  brillo.oninput = () => { marcarBrillo(s, +brillo.value); enviar(l.id, { brillo: +brillo.value }); };
  tono.oninput = () => {
    const c = hueAHex(+tono.value);
    fijarColor(s, c);
    s.classList.add('on');
    textoEstado(s);
    enviar(l.id, { color: c });
  };
  s.querySelectorAll('.blanco').forEach(b => b.onclick = () => {
    const t = +b.dataset.t;
    fijarColor(s, PRESETS.find(p => p[1] === t)[2]);
    s.classList.add('on');
    textoEstado(s);
    enviar(l.id, { blanco: t, brillo: +brillo.value }, true);
  });
  detalle.appendChild(s);

  // Mosaico en el inicio: tocarlo abre la luz, el botón de la esquina la prende o apaga
  const m = document.createElement('div');
  m.className = 'mosaico m-luz';
  m.innerHTML = `<button class="abrir" aria-label="Abrir ${l.nombre}"></button>
    <div class="m-icono">${FOCO}</div>
    <div class="textos"><div class="m-titulo"></div><div class="m-sub"></div></div>
    <button class="m-power" aria-label="Encender o apagar">${ICONO}</button>`;
  m.querySelector('.m-titulo').textContent = l.nombre;
  m.querySelector('.abrir').onclick = () => abrir(s);
  m.querySelector('.m-power').onclick = alternar;
  grillaLuces.appendChild(m);
  mosaicos[l.id] = m;

  // Chip para elegir si esta luz entra en las escenas
  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.innerHTML = '<i></i><span></span>';
  chip.querySelector('span').textContent = l.nombre;
  chip.dataset.id = l.id;
  chip.onclick = () => { fueraDeEscenas[l.id] = !fueraDeEscenas[l.id]; guardarSelector(); pintarSelector(); };
  document.getElementById('selector').appendChild(chip);
  pintarSelector();
  s.dataset.id = l.id;
  return tarjetas[l.id] = s;
}

function textoEstado(s) {
  s.querySelector('.estado').textContent = s.classList.contains('offline') ? 'Sin conexión'
    : s.classList.contains('on') ? 'Encendida' : 'Apagada';
  pintarMosaico(s);
  if (s === abierta) pintarAmbiente();
}
function marcarBrillo(s, v) {
  s.querySelector('.brillo').style.setProperty('--p', v + '%');
  s.querySelector('.pct').textContent = v + '%';
  pintarMosaico(s);
}
function fijarColor(s, c) { s.style.setProperty('--color', c); pintarMosaico(s); if (s === abierta) pintarAmbiente(); }

function pintarMosaico(s) {
  const m = mosaicos[s.dataset.id];
  if (!m) return;
  const on = s.classList.contains('on'), off = s.classList.contains('offline');
  m.classList.toggle('on', on && !off);
  m.classList.toggle('offline', off);
  m.style.setProperty('--color', s.style.getPropertyValue('--color') || '#ffb347');
  m.querySelector('.m-sub').textContent = off ? 'Sin conexión' : on ? `Prendida · ${s.querySelector('.brillo').value}%` : 'Apagada';
}

function pintar(l) {
  const s = tarjetas[l.id] || crear(l);
  s.classList.toggle('offline', !l.online);
  if (!l.online) return textoEstado(s);
  if (tocadoReciente(l.id)) return;
  s.classList.toggle('on', l.encendida);
  fijarColor(s, l.color);
  s.querySelector('.brillo').value = l.brillo;
  marcarBrillo(s, l.brillo);
  s.querySelector('.tono').value = hexAHue(l.color);
  textoEstado(s);
}

async function refrescar() {
  try { (await (await fetch('/api/luces')).json()).forEach(pintar); } catch (e) {}
}
refrescar();
setInterval(refrescar, 4000);

// ---- escenas ----
// Se guardan las luces que NO entran en las escenas, así una luz nueva entra sola
let fueraDeEscenas = {};
try { fueraDeEscenas = JSON.parse(localStorage.getItem('fuera-de-escenas')) || {}; } catch (e) {}
function guardarSelector() { try { localStorage.setItem('fuera-de-escenas', JSON.stringify(fueraDeEscenas)); } catch (e) {} }
function pintarSelector() {
  let alguna = false;
  document.querySelectorAll('.chip').forEach(c => {
    const sel = !fueraDeEscenas[c.dataset.id];
    c.classList.toggle('sel', sel);
    c.querySelector('i').textContent = sel ? '✓' : '';
    alguna = alguna || sel;
  });
  document.getElementById('escenas').classList.toggle('sin-luces', !alguna);
}
function aplicarEscena(cambios) {
  for (const s of Object.values(tarjetas)) {
    if (s.classList.contains('offline') || fueraDeEscenas[s.dataset.id]) continue;
    s.classList.toggle('on', cambios.encendida);          // respuesta inmediata en la pantalla
    if (cambios.color) { fijarColor(s, cambios.color); s.querySelector('.tono').value = hexAHue(cambios.color); }
    if ('blanco' in cambios) fijarColor(s, PRESETS.find(p => p[1] === cambios.blanco)[2]);
    if (cambios.brillo) { s.querySelector('.brillo').value = cambios.brillo; marcarBrillo(s, cambios.brillo); }
    textoEstado(s);
    enviar(s.dataset.id, cambios, true);
  }
}
const escenas = document.getElementById('escenas');
for (const [nombre, icono, cambios] of ESCENAS) {
  const b = document.createElement('button');
  b.className = 'escena';
  b.innerHTML = `<span>${icono}</span>${nombre}`;
  b.onclick = () => { aplicarEscena(cambios); b.classList.add('tocada'); setTimeout(() => b.classList.remove('tocada'), 300); };
  escenas.appendChild(b);
}

// ---- reloj ----
const hora = d => d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
const fecha = d => d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
function pintarReloj() {
  const ahora = new Date();
  document.querySelectorAll('.hora').forEach(e => e.textContent = hora(ahora));
  document.querySelectorAll('.fecha').forEach(e => e.textContent = fecha(ahora).replace(/^./, c => c.toUpperCase()));
}
pintarReloj();
setInterval(pintarReloj, 5000);

// ---- ventana: a qué hora salir al trabajo ----
const viaje = document.createElement('section');
viaje.className = 'luz info';
viaje.dataset.ambiente = '#1d2a44';
viaje.innerHTML = `
  <div class="cabecera"><h1 class="nombre">Salir al trabajo</h1><div class="estado"></div></div>
  <div><div class="grande">--:--</div><div class="sub"></div></div>
  <div class="datos"></div>
  <div class="aviso"></div>`;
detalle.appendChild(viaje);
document.getElementById('m-viaje').onclick = () => abrir(viaje);

const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
let datosViaje = null;

function pintarViaje() {
  const v = datosViaje, $ = q => viaje.querySelector(q), mv = document.getElementById('m-viaje');
  if (!v) return;
  if (!v.ok) {
    $('.grande').textContent = '--:--'; $('.sub').textContent = ''; $('.datos').innerHTML = '';
    $('.estado').textContent = ''; $('.aviso').textContent = v.error;
    mv.querySelector('.m-grande').textContent = '--:--';
    return;
  }
  const salida = new Date(v.salida), llegada = new Date(v.llegada), ahora = new Date();
  const manana = new Date(ahora.getTime() + 864e5);
  const cuando = llegada.toDateString() === ahora.toDateString() ? 'hoy'
    : llegada.toDateString() === manana.toDateString() ? 'mañana' : 'el ' + DIAS[llegada.getDay()];
  $('.estado').textContent = `Para llegar ${cuando} a las ${hora(llegada)}`;
  $('.grande').textContent = hora(salida);
  const faltan = Math.round((salida - ahora) / 60000);
  const sub = faltan < 0 ? `Ya tendrías que haber salido (hace ${-faltan} min)`
    : faltan <= 90 ? `Salí en ${faltan} min` : 'Hora de salida';
  $('.sub').textContent = sub;
  $('.datos').innerHTML = `
    <div class="dato"><b>${v.minutos} min</b><span>de viaje</span></div>
    <div class="dato"><b>${v.demora ? '+' + v.demora : '0'} min</b><span>por tráfico</span></div>
    <div class="dato"><b>${String(v.km).replace('.', ',')} km</b><span>distancia</span></div>`;
  $('.aviso').textContent = 'Con el tráfico en vivo de TomTom';
  mv.querySelector('.m-grande').textContent = hora(salida);
  mv.querySelector('.m-sub').textContent = faltan >= 0 && faltan <= 90 ? sub : `Salir ${cuando} · ${v.minutos} min`;
  document.querySelector('#noche .salida').textContent = `Salir ${cuando} a las ${hora(salida)}`;
}
async function refrescarViaje() {
  try { datosViaje = await (await fetch('/api/viaje')).json(); } catch (e) {}
  pintarViaje();
}
refrescarViaje();
setInterval(refrescarViaje, 2 * 60000);
setInterval(pintarViaje, 30000);   // para que "Salí en X min" avance solo

// ---- ventana: clima en casa y en el trabajo ----
const clima = document.createElement('section');
clima.className = 'luz info clima';
clima.dataset.ambiente = '#173041';
clima.innerHTML = `<div class="cabecera"><h1 class="nombre">Clima</h1></div>
  <div class="lugar" data-l="casa"></div><div class="lugar" data-l="trabajo"></div>`;
detalle.appendChild(clima);
document.getElementById('m-clima').onclick = () => abrir(clima);

// Códigos del tiempo de Open-Meteo (WMO): [códigos, descripción, ícono de día, ícono de noche]
const TIEMPO = [[[0], 'Despejado', '☀️', '🌙'], [[1], 'Mayormente despejado', '🌤️', '🌙'], [[2], 'Parcialmente nublado', '⛅', '☁️'],
  [[3], 'Nublado', '☁️', '☁️'], [[45, 48], 'Niebla', '🌫️', '🌫️'], [[51, 53, 55, 56, 57], 'Llovizna', '🌦️', '🌧️'],
  [[61, 63, 66, 80, 81], 'Lluvia', '🌧️', '🌧️'], [[65, 67, 82], 'Lluvia fuerte', '🌧️', '🌧️'],
  [[71, 73, 75, 77, 85, 86], 'Nieve', '🌨️', '🌨️'], [[95, 96, 99], 'Tormenta', '⛈️', '⛈️']];
const grados = n => Math.round(n) + '°';

async function refrescarClima() {
  let d;
  try { d = await (await fetch('/api/clima')).json(); } catch (e) { return; }
  const filas = [];
  for (const clave of ['casa', 'trabajo']) {
    const c = d[clave], caja = clima.querySelector(`[data-l="${clave}"]`);
    if (!c) continue;
    if (!c.ok) {
      caja.innerHTML = `<div class="arriba"><span>${c.nombre}</span></div><div class="extra"></div>`;
      caja.querySelector('.extra').textContent = 'Sin datos: ' + c.error;
      filas.push(`<div class="fila"><b>--</b><span>${c.nombre}</span></div>`);
      continue;
    }
    const t = TIEMPO.find(x => x[0].includes(c.codigo)) || [[], 'Variable', '🌡️', '🌡️'];
    const icono = c.dia ? t[2] : t[3];
    // El estado es el de ahora; si no llueve pero es probable que llueva pronto, se avisa
    const desc = t[1] + (c.codigo < 51 && c.lluvia_3h >= 50 ? ', puede llover pronto' : '');
    caja.innerHTML = `
      <div class="arriba"><span>${c.nombre}</span><span>${grados(c.min)} / ${grados(c.max)}</span></div>
      <div class="medio"><span class="icono">${icono}</span><span class="temp">${grados(c.temp)}</span><span class="desc">${desc}</span></div>
      <div class="extra"><span>Sensación ${grados(c.sensacion)}</span><span>Lluvia próx. 3 h ${c.lluvia_3h}%</span><span>Próx. 12 h ${c.lluvia_12h}%</span>
        <span>Humedad ${c.humedad}%</span><span>Viento ${Math.round(c.viento)} km/h</span></div>`;
    filas.push(`<div class="fila"><span>${icono}</span><b>${grados(c.temp)}</b><span>${c.nombre}</span></div>`);
  }
  const mc = document.getElementById('m-clima');
  mc.querySelector('.filas').innerHTML = filas.join('');
  mc.querySelector('.m-icono').classList.add('oculta');
}
refrescarClima();
setInterval(refrescarClima, 10 * 60000);

// ---- modo noche ----
const noche = document.getElementById('noche');
let nocheManual = false, ultimoToque = Date.now();
const enMinutos = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
function esHorarioNoche() {
  const d = new Date(), m = d.getHours() * 60 + d.getMinutes(), desde = enMinutos(NOCHE_DESDE), hasta = enMinutos(NOCHE_HASTA);
  return desde > hasta ? m >= desde || m < hasta : m >= desde && m < hasta;
}
function revisarNoche() {
  // De noche vuelve sola al reloj tenue si nadie tocó la pantalla en 2 minutos
  const mostrar = nocheManual || (esHorarioNoche() && Date.now() - ultimoToque > 2 * 60000);
  noche.classList.toggle('oculta', !mostrar);
}
document.getElementById('m-noche').onclick = () => { nocheManual = true; revisarNoche(); };
noche.onclick = () => { nocheManual = false; ultimoToque = Date.now(); revisarNoche(); };
setInterval(revisarNoche, 15000);

// Si nadie toca la pantalla por un rato, vuelve sola al inicio
addEventListener('pointerdown', () => { ultimoToque = Date.now(); }, true);
setInterval(() => {
  if (abierta && Date.now() - ultimoToque > 2 * 60000) history.state ? history.back() : cerrar();
}, 10000);

// ---- que la pantalla no se apague (si el navegador lo permite) ----
let candado = null;
async function pedirCandado() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') candado = await navigator.wakeLock.request('screen'); } catch (e) {}
}
pedirCandado();
document.addEventListener('visibilitychange', pedirCandado);
</script>
