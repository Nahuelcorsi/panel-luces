<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icono.svg">
<title>Mis luces</title>
<style>
  :root {
    --fondo: #0b0d12;
    --texto: #f4f6fa;
    --suave: rgba(244, 246, 250, .55);
    --vidrio: rgba(255, 255, 255, .07);
    --borde: rgba(255, 255, 255, .10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fondo); color: var(--texto);
               font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* Fondo que toma el color de la luz que se está viendo */
  #ambiente { position: fixed; inset: 0; transition: background 1s ease;
              background: radial-gradient(120% 70% at 50% 28%, var(--ambiente, #1a1f2b) 0%, transparent 65%); opacity: .55; }

  #carrusel { position: relative; height: 100%; display: flex; overflow-x: auto; overflow-y: hidden;
              scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  #carrusel::-webkit-scrollbar { display: none; }

  .luz { flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always;
         display: flex; flex-direction: column; align-items: center; justify-content: space-between;
         padding: calc(44px + env(safe-area-inset-top)) 24px calc(56px + env(safe-area-inset-bottom));
         overflow-y: auto; }
  .luz > * { width: 100%; max-width: 420px; }

  .cabecera { text-align: center; }
  .nombre { margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -.02em; }
  .estado { margin-top: 4px; color: var(--suave); font-size: 15px; }

  /* Botón de encendido */
  .centro { display: flex; justify-content: center; padding: 12px 0; }
  .power { position: relative; width: 168px; height: 168px; border-radius: 50%; border: 1px solid var(--borde);
           background: var(--vidrio); display: grid; place-items: center; transition: all .35s ease; }
  .power svg { width: 64px; height: 64px; stroke: var(--suave); fill: none; stroke-width: 2.2;
               stroke-linecap: round; transition: stroke .35s; }
  .luz.on .power { background: var(--color); border-color: transparent;
                   box-shadow: 0 0 0 14px color-mix(in srgb, var(--color) 18%, transparent),
                               0 0 90px 10px color-mix(in srgb, var(--color) 55%, transparent); }
  .luz.on .power svg { stroke: #101218; }
  .power:active { transform: scale(.96); }

  /* Controles */
  .controles { display: flex; flex-direction: column; gap: 22px; }
  .fila-titulo { display: flex; justify-content: space-between; color: var(--suave); font-size: 14px; margin-bottom: 10px; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; margin: 0; outline: none; touch-action: pan-y; }
  input[type=range]::-webkit-slider-runnable-track { border-radius: 99px; }
  input[type=range]::-moz-range-track { border-radius: 99px; }

  /* Brillo: barra gruesa que se llena */
  .brillo { height: 58px; border-radius: 99px;
            background: linear-gradient(to right, var(--color) var(--p, 50%), var(--vidrio) var(--p, 50%)); border: 1px solid var(--borde); }
  .brillo::-webkit-slider-thumb { -webkit-appearance: none; width: 4px; height: 58px; background: transparent; }
  .brillo::-moz-range-thumb { width: 4px; height: 58px; background: transparent; border: 0; }

  /* Tono: arcoíris */
  .tono { height: 26px; border-radius: 99px; border: 1px solid var(--borde);
          background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  .tono::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%;
          background: #fff; border: 3px solid rgba(0, 0, 0, .35); box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
  .tono::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 3px solid rgba(0, 0, 0, .35); }

  .blancos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .blanco { border: 1px solid var(--borde); background: var(--vidrio); border-radius: 16px; padding: 13px 0; font-size: 15px; transition: background .2s; }
  .blanco:active { background: rgba(255, 255, 255, .18); }
  .blanco i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }

  .luz.offline .centro, .luz.offline .controles { opacity: .25; pointer-events: none; }

  /* Indicador de página */
  #puntos { position: fixed; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 10px; }
  #puntos button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 99px; background: rgba(255, 255, 255, .28); transition: all .3s; }
  #puntos button.activo { width: 26px; background: #fff; }

  /* Ventanas de información (viaje y clima) */
  .info { justify-content: center; gap: 28px; }
  .grande { font-size: 84px; font-weight: 700; letter-spacing: -.04em; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
  .sub { margin-top: 8px; text-align: center; color: var(--suave); font-size: 16px; }
  .datos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .dato { border: 1px solid var(--borde); background: var(--vidrio); border-radius: 16px; padding: 12px 6px; text-align: center; }
  .dato b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .dato span { color: var(--suave); font-size: 13px; }
  .aviso { text-align: center; color: var(--suave); font-size: 15px; }
  .info.clima { justify-content: space-evenly; gap: 16px; }
  .lugar { border: 1px solid var(--borde); background: var(--vidrio); border-radius: 24px; padding: 18px 20px; }
  .lugar .arriba { display: flex; justify-content: space-between; align-items: baseline; color: var(--suave); font-size: 15px; }
  .lugar .medio { display: flex; align-items: center; gap: 14px; margin: 6px 0 8px; }
  .lugar .icono { font-size: 52px; line-height: 1; }
  .lugar .temp { font-size: 56px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .lugar .desc { font-size: 17px; }
  .lugar .extra { color: var(--suave); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; }

  @media (max-height: 640px) { .power { width: 128px; height: 128px; } .power svg { width: 48px; height: 48px; } .controles { gap: 14px; } }
</style>
</head>
<body>
<div id="ambiente"></div>
<div id="carrusel"></div>
<div id="puntos"></div>

<script>
const carrusel = document.getElementById('carrusel');
const puntos = document.getElementById('puntos');
const ambiente = document.getElementById('ambiente');
const tarjetas = {};      // id -> elemento
const tocado = {};        // id -> instante del último toque (para no pisar lo que estás moviendo)
const pendiente = {};     // id -> cambios acumulados por enviar
const temporizador = {};

const ICONO = '<svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>';
const PRESETS = [['Cálido', 0, '#ffb86b'], ['Neutro', 50, '#fff1dc'], ['Frío', 100, '#cfe3ff']];

// ---- color ----
function hexAHue(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), d = max - Math.min(r, g, b);
  if (!d) return 0;
  const h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return Math.round(((h * 60) + 360) % 360);
}
function hueAHex(h) {
  const f = n => { const k = (n + h / 60) % 6; return Math.round(255 * (1 - Math.max(0, Math.min(k, 4 - k, 1)))); };
  return '#' + [f(5), f(3), f(1)].map(v => v.toString(16).padStart(2, '0')).join('');
}

// ---- envío (agrupa y limita la frecuencia mientras deslizás) ----
function enviar(id, cambios, ya) {
  tocado[id] = Date.now();
  pendiente[id] = Object.assign(pendiente[id] || {}, cambios);
  if (temporizador[id] && !ya) return;
  const mandar = async () => {
    const lote = pendiente[id]; pendiente[id] = null; temporizador[id] = null;
    if (!lote) return;
    try {
      const r = await fetch('/api/luces/' + id, { method: 'POST', body: JSON.stringify(lote) });
      if (r.ok && !tocadoReciente(id)) pintar(await r.json());
    } catch (e) {}
  };
  if (ya) return mandar();
  temporizador[id] = setTimeout(mandar, 140);
}
const tocadoReciente = id => Date.now() - (tocado[id] || 0) < 2500;

// ---- tarjetas ----
function crear(l) {
  const s = document.createElement('section');
  s.className = 'luz';
  s.innerHTML = `
    <div class="cabecera"><h1 class="nombre"></h1><div class="estado"></div></div>
    <div class="centro"><button class="power" aria-label="Encender o apagar">${ICONO}</button></div>
    <div class="controles">
      <div><div class="fila-titulo"><span>Brillo</span><span class="pct"></span></div>
        <input class="brillo" type="range" min="1" max="100"></div>
      <div><div class="fila-titulo"><span>Color</span></div>
        <input class="tono" type="range" min="0" max="359"></div>
      <div class="blancos">${PRESETS.map(p => `<button class="blanco" data-t="${p[1]}"><i style="background:${p[2]}"></i>${p[0]}</button>`).join('')}</div>
    </div>`;
  s.querySelector('.nombre').textContent = l.nombre;

  s.querySelector('.power').onclick = () => {
    const encender = !s.classList.contains('on');
    s.classList.toggle('on', encender);               // respuesta inmediata
    textoEstado(s);
    enviar(l.id, { encendida: encender }, true);
  };
  const brillo = s.querySelector('.brillo'), tono = s.querySelector('.tono');
  brillo.oninput = () => { marcarBrillo(s, +brillo.value); enviar(l.id, { brillo: +brillo.value }); };
  tono.oninput = () => {
    const c = hueAHex(+tono.value);
    fijarColor(s, c);
    s.classList.add('on');
    textoEstado(s);
    enviar(l.id, { color: c });
  };
  s.querySelectorAll('.blanco').forEach(b => b.onclick = () => {
    const t = +b.dataset.t;
    fijarColor(s, PRESETS.find(p => p[1] === t)[2]);
    s.classList.add('on');
    textoEstado(s);
    enviar(l.id, { blanco: t, brillo: +brillo.value }, true);
  });

  agregarPagina(s, l.nombre, carrusel.querySelector('.info'));   // las luces van antes de las ventanas de información
  return tarjetas[l.id] = s;
}

function agregarPagina(s, nombre, antesDe) {
  const i = antesDe ? [...carrusel.children].indexOf(antesDe) : -1;
  carrusel.insertBefore(s, antesDe || null);
  const p = document.createElement('button');
  p.setAttribute('aria-label', nombre);
  p.onclick = () => s.scrollIntoView({ behavior: 'smooth', inline: 'center' });
  puntos.insertBefore(p, i >= 0 ? puntos.children[i] : null);
}

function textoEstado(s) {
  s.querySelector('.estado').textContent = s.classList.contains('offline') ? 'Sin conexión'
    : s.classList.contains('on') ? 'Encendida' : 'Apagada';
  ambienteDe(s);
}
function marcarBrillo(s, v) {
  s.querySelector('.brillo').style.setProperty('--p', v + '%');
  s.querySelector('.pct').textContent = v + '%';
}
function ambienteDe(s) {
  if (s !== visible()) return;
  const encendida = s.classList.contains('on');
  ambiente.style.setProperty('--ambiente', encendida ? (s.style.getPropertyValue('--color') || '#1a1f2b') : '#1a1f2b');
}
function fijarColor(s, c) { s.style.setProperty('--color', c); ambienteDe(s); }

function pintar(l) {
  const s = tarjetas[l.id] || crear(l);
  s.classList.toggle('offline', !l.online);
  if (!l.online) return textoEstado(s);
  if (tocadoReciente(l.id)) return;
  s.classList.toggle('on', l.encendida);
  textoEstado(s);
  fijarColor(s, l.color);
  s.querySelector('.brillo').value = l.brillo;
  marcarBrillo(s, l.brillo);
  s.querySelector('.tono').value = hexAHue(l.color);
}

// ---- carrusel ----
function visible() { return carrusel.children[Math.round(carrusel.scrollLeft / carrusel.clientWidth)]; }
function actualizarPagina() {
  const i = Math.round(carrusel.scrollLeft / carrusel.clientWidth);
  [...puntos.children].forEach((p, n) => p.classList.toggle('activo', n === i));
  const s = carrusel.children[i];
  if (s && s.classList.contains('info')) ambiente.style.setProperty('--ambiente', s.dataset.ambiente);
  else if (s) ambienteDe(s);
  puntos.style.display = carrusel.children.length > 1 ? 'flex' : 'none';
}
carrusel.addEventListener('scroll', actualizarPagina, { passive: true });
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') carrusel.scrollBy({ left: carrusel.clientWidth, behavior: 'smooth' });
  if (e.key === 'ArrowLeft') carrusel.scrollBy({ left: -carrusel.clientWidth, behavior: 'smooth' });
});

async function refrescar() {
  try { (await (await fetch('/api/luces')).json()).forEach(pintar); actualizarPagina(); } catch (e) {}
}
refrescar();
setInterval(refrescar, 4000);

// ---- ventana: a qué hora salir al trabajo ----
const viaje = document.createElement('section');
viaje.className = 'luz info';
viaje.dataset.ambiente = '#1d2a44';
viaje.innerHTML = `
  <div class="cabecera"><h1 class="nombre">Salir al trabajo</h1><div class="estado"></div></div>
  <div><div class="grande">--:--</div><div class="sub"></div></div>
  <div class="datos"></div>
  <div class="aviso"></div>`;
agregarPagina(viaje, 'Salir al trabajo');

const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const hora = d => d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
let datosViaje = null;

function pintarViaje() {
  const v = datosViaje, $ = q => viaje.querySelector(q);
  if (!v) return;
  if (!v.ok) {
    $('.grande').textContent = '--:--'; $('.sub').textContent = ''; $('.datos').innerHTML = '';
    $('.estado').textContent = ''; $('.aviso').textContent = v.error;
    return;
  }
  const salida = new Date(v.salida), llegada = new Date(v.llegada), ahora = new Date();
  const manana = new Date(ahora.getTime() + 864e5);
  const cuando = llegada.toDateString() === ahora.toDateString() ? 'hoy'
    : llegada.toDateString() === manana.toDateString() ? 'mañana' : 'el ' + DIAS[llegada.getDay()];
  $('.estado').textContent = `Para llegar ${cuando} a las ${hora(llegada)}`;
  $('.grande').textContent = hora(salida);
  const faltan = Math.round((salida - ahora) / 60000);
  $('.sub').textContent = faltan < 0 ? `Ya tendrías que haber salido (hace ${-faltan} min)`
    : faltan <= 90 ? `Salí en ${faltan} min` : 'Hora de salida';
  $('.datos').innerHTML = `
    <div class="dato"><b>${v.minutos} min</b><span>de viaje</span></div>
    <div class="dato"><b>${v.demora ? '+' + v.demora : '0'} min</b><span>por tráfico</span></div>
    <div class="dato"><b>${String(v.km).replace('.', ',')} km</b><span>distancia</span></div>`;
  $('.aviso').textContent = 'Con el tráfico en vivo de TomTom';
}
async function refrescarViaje() {
  try { datosViaje = await (await fetch('/api/viaje')).json(); } catch (e) {}
  pintarViaje();
}
refrescarViaje();
setInterval(refrescarViaje, 2 * 60000);
setInterval(pintarViaje, 30000);   // para que "Salí en X min" avance solo

// ---- ventana: clima en casa y en el trabajo ----
const clima = document.createElement('section');
clima.className = 'luz info clima';
clima.dataset.ambiente = '#173041';
clima.innerHTML = `<div class="cabecera"><h1 class="nombre">Clima</h1></div>
  <div class="lugar" data-l="casa"></div><div class="lugar" data-l="trabajo"></div>`;
agregarPagina(clima, 'Clima');

// Códigos del tiempo de Open-Meteo (WMO): [códigos, descripción, ícono de día, ícono de noche]
const TIEMPO = [[[0], 'Despejado', '☀️', '🌙'], [[1], 'Mayormente despejado', '🌤️', '🌙'], [[2], 'Parcialmente nublado', '⛅', '☁️'],
  [[3], 'Nublado', '☁️', '☁️'], [[45, 48], 'Niebla', '🌫️', '🌫️'], [[51, 53, 55, 56, 57], 'Llovizna', '🌦️', '🌧️'],
  [[61, 63, 66, 80, 81], 'Lluvia', '🌧️', '🌧️'], [[65, 67, 82], 'Lluvia fuerte', '🌧️', '🌧️'],
  [[71, 73, 75, 77, 85, 86], 'Nieve', '🌨️', '🌨️'], [[95, 96, 99], 'Tormenta', '⛈️', '⛈️']];
const grados = n => Math.round(n) + '°';

async function refrescarClima() {
  let d;
  try { d = await (await fetch('/api/clima')).json(); } catch (e) { return; }
  for (const clave of ['casa', 'trabajo']) {
    const c = d[clave], caja = clima.querySelector(`[data-l="${clave}"]`);
    if (!c) continue;
    if (!c.ok) {
      caja.innerHTML = `<div class="arriba"><span>${c.nombre}</span></div><div class="extra"></div>`;
      caja.querySelector('.extra').textContent = 'Sin datos: ' + c.error;
      continue;
    }
    const t = TIEMPO.find(x => x[0].includes(c.codigo)) || [[], 'Variable', '🌡️', '🌡️'];
    caja.innerHTML = `
      <div class="arriba"><span>${c.nombre}</span><span>${grados(c.min)} / ${grados(c.max)}</span></div>
      <div class="medio"><span class="icono">${c.dia ? t[2] : t[3]}</span><span class="temp">${grados(c.temp)}</span><span class="desc">${t[1]}</span></div>
      <div class="extra"><span>Sensación ${grados(c.sensacion)}</span><span>Lluvia ${c.lluvia ?? 0}%</span>
        <span>Humedad ${c.humedad}%</span><span>Viento ${Math.round(c.viento)} km/h</span></div>`;
  }
}
refrescarClima();
setInterval(refrescarClima, 10 * 60000);

// ---- que la pantalla no se apague (si el navegador lo permite) ----
let candado = null;
async function pedirCandado() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') candado = await navigator.wakeLock.request('screen'); } catch (e) {}
}
pedirCandado();
document.addEventListener('visibilitychange', pedirCandado);
</script>
</body>
</html>
