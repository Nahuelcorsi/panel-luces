    <p id="burbuja">¡Hola! Tocá el micrófono o escribime algo.</p>

    <form id="chat">
      <button type="button" id="mic" title="Hablar">🎤</button>
      <input id="texto" autocomplete="off" placeholder="Escribile algo...">
      <button type="submit">Enviar</button>
    </form>

    <!-- Solo en el panel de casa: lo que Rickuel recuerda de vos (se puede borrar) -->
    <details id="memoria" hidden>
      <summary>Lo que recuerdo de vos<span id="memoria-cuenta"></span></summary>
      <ul id="recuerdos"></ul>
      <p class="aviso-memoria">Decile «acordate de que…» para sumar algo, o «olvidá…» para sacarlo.</p>
    </details>

    <details id="ajustes">
      <summary>⚙️ Ajustes</summary>
      <label>Cerebro
        <select id="cerebro">
          <option value="gemini">Gemini (gratis, con límite diario)</option>
          <option value="local">Modelo propio en tu compu (gratis, con Ollama)</option>
          <option value="claude">Claude (API paga)</option>
        </select>
      </label>
      <div data-cerebro="gemini">
        <label>Clave de Gemini <small>(gratis en aistudio.google.com/apikey)</small>
          <input id="gemini-key" type="password" placeholder="AIza...">
        </label>
        <label>Modelo de Gemini
          <input id="gemini-modelo" placeholder="gemini-flash-latest">
        </label>
      </div>
      <div data-cerebro="local">
        <label>Dirección de Ollama
          <input id="local-url" placeholder="http://localhost:11434">
        </label>
        <label>Modelo
          <input id="local-modelo" placeholder="qwen2.5:3b">
        </label>
      </div>
      <div data-cerebro="claude">
        <label>API key de Claude
          <input id="api-key" type="password" placeholder="sk-ant-...">
        </label>
      </div>
      <label>Nombre del amigo
        <input id="nombre" placeholder="Rickuel">
      </label>
      <label>Voz
        <select id="voz"></select>
      </label>
      <label><input id="hablar" type="checkbox" checked> Responder en voz alta</label>
      <button type="button" id="guardar">Guardar</button>
      <button type="button" id="bajar-charlas">Bajar charlas guardadas</button>
    </details>
